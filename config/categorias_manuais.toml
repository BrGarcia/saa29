## ============================================================
## SAA29 — Módulo `publicacoes`
## Mapa estático de categoria e descrição por manual do acervo A.
## ============================================================
##
## POR QUE ESTE ARQUIVO EXISTE
## O sistema legado categorizava os manuais por um `manual_type.xml` que o
## acervo real NÃO possui (01_achados_do_acervo.md §2 — não há sidecar de
## nenhum tipo). Sem ele, a categorização vira um mapa mantido no repositório.
## É o que a RN-04 reformulada prevê (03_especificacao_tecnica.md §2.3).
##
## DE ONDE VÊM AS DESCRIÇÕES
## Não foram inventadas: cada `descricao_pt` foi conferida contra o título dos
## próprios documentos, lido do índice Lucene legado (`index_2.0/`) de cada
## manual. Ex.: CPM_1740 traz um documento intitulado "cpm-1740 - manual de
## prevenção de corrosão"; CPC_1739 traz "catálogo de produtos consumíveis".
## Onde o índice não nomeia a publicação (os OTFN cujo título é o placeholder
## "ase, do not delete this file..."), a descrição foi derivada da designação
## da própria ordem técnica.
##
## CHAVE = nome do diretório em PUBLICACOES_ACERVO_DIR/Manuais/, exato.
##
## FALLBACK: manual sem entrada aqui cai em [_default] e é indexado
## normalmente — este arquivo NUNCA quebra a indexação (E-04). É por isso que
## ele pode ser preenchido de forma incremental quando chegarem manuais novos.
##
## STATUS DOS RÓTULOS DE `categoria`: provisórios. A decisão D-01 (rótulos
## definitivos, validados com a seção) segue em aberto e não bloqueia nenhum
## marco até o M4 — ver 05_rastreabilidade_externa.md. Trocar um rótulo aqui
## é uma edição de texto seguida de reindexação; não há migration envolvida.

