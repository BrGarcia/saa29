{% extends "base.html" %}

{% block page_title %}Calendario Operacional{% endblock %}

{% block content %}
<div class="calendar-shell">
    <aside class="calendar-sidebar">
        <div class="calendar-section">
            <div class="calendar-mini-title">Fontes</div>
            <label class="calendar-check"><input type="checkbox" class="calendar-source-filter" value="calendario" checked> Efetivo</label>
            <label class="calendar-check"><input type="checkbox" class="calendar-source-filter" value="inspecao" checked> Inspecoes</label>
            <label class="calendar-check"><input type="checkbox" class="calendar-source-filter" value="task"> Tarefas</label>
        </div>
        <div class="calendar-section">
            <div class="calendar-mini-title">Periodo</div>
            <div id="calendar-range-label" class="calendar-range-label"></div>
        </div>
        <button type="button" class="btn btn-primary calendar-full-button" id="calendar-new-btn">Novo Evento</button>
    </aside>

    <section class="calendar-main">
        <div class="calendar-toolbar">
            <div class="calendar-nav">
                <button type="button" class="btn-icon" id="calendar-prev-btn" title="Anterior" aria-label="Anterior">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                </button>
                <button type="button" class="btn btn-outline" id="calendar-today-btn">Hoje</button>
                <button type="button" class="btn-icon" id="calendar-next-btn" title="Proximo" aria-label="Proximo">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
            <h3 id="calendar-title" class="calendar-title"></h3>
            <div class="calendar-view-switch">
                <button type="button" class="calendar-view-btn is-active" data-view="month">Mes</button>
                <button type="button" class="calendar-view-btn" data-view="week">Semana</button>
                <button type="button" class="calendar-view-btn" data-view="day">Dia</button>
                <button type="button" class="calendar-view-btn" data-view="year">Ano</button>
            </div>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>
    </section>
</div>

<div id="calendar-event-modal" class="calendar-modal-backdrop" hidden>
    <div class="calendar-modal">
        <div class="calendar-modal-header">
            <h3 id="calendar-modal-title">Evento</h3>
            <button type="button" class="btn-icon" id="calendar-modal-close" title="Fechar" aria-label="Fechar">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form id="calendar-event-form">
            <input type="hidden" id="calendar-event-id">
            <div class="form-group">
                <label class="form-label" for="calendar-event-type">Tipo</label>
                <select id="calendar-event-type" class="form-input" required></select>
            </div>
            <div class="form-group">
                <label class="form-label" for="calendar-owner">Militar</label>
                <select id="calendar-owner" class="form-input" required></select>
            </div>
            <div class="calendar-form-row">
                <div class="form-group">
                    <label class="form-label" for="calendar-start">Inicio</label>
                    <input type="datetime-local" id="calendar-start" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="calendar-end">Fim</label>
                    <input type="datetime-local" id="calendar-end" class="form-input" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="calendar-notes">Observacoes</label>
                <textarea id="calendar-notes" class="form-input" rows="4"></textarea>
            </div>
            <div class="calendar-modal-actions">
                <button type="button" class="btn btn-outline" id="calendar-delete-btn">Excluir</button>
                <button type="button" class="btn btn-outline" id="calendar-cancel-btn">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="calendar-save-btn">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/calendario.js"></script>
{% endblock %}
