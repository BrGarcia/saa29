{% extends "base.html" %}

{% block page_title %}Visualizar documento{% endblock %}

{% block content %}
<div id="pub-viewer-context"
     data-doc-id="{{ doc_id }}"
     data-pdf-url="/publicacoes/doc/{{ doc_id }}/pdf"
     data-worker-src="/static/js/pdfjs/pdf.worker.min.mjs"
     style="display: none;"></div>

<div class="card" style="margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">
    <div>
        <div id="pub-viewer-titulo" style="font-weight: 600;">Carregando…</div>
        <div id="pub-viewer-subtitulo" style="font-size: 0.85rem; color: var(--text-secondary);"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" class="btn-icon" id="pub-viewer-prev" title="Página anterior" aria-label="Página anterior">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
        </button>
        <span id="pub-viewer-pagina" style="min-width: 90px; text-align: center;">— / —</span>
        <button type="button" class="btn-icon" id="pub-viewer-next" title="Próxima página" aria-label="Próxima página">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
        </button>
        <a id="pub-viewer-download" class="btn btn-outline" download>Baixar PDF</a>
    </div>
</div>

<div id="pub-viewer-revisao-anterior" class="card" style="display: none; margin-bottom: 0.75rem; border-color: var(--warning-color, #d97706); color: var(--warning-color, #d97706);">
    Esta é uma REVISÃO ANTERIOR do documento — a edição vigente pode conter mudanças.
</div>

<div id="pub-viewer-erro" class="card" style="display: none; text-align: center; color: var(--text-secondary); padding: 2rem;"></div>

<!--
    Canvas, nunca iframe/embed/object: X-Frame-Options: DENY é global (decisão
    D-F, docs/backlog/modulo_publicacoes/03_especificacao_tecnica.md §4.4) e
    bloqueia qualquer elemento que crie um browsing context, mesmo same-origin
    — confirmado como bug real em app/web/static/js/panes_detalhe.js
    (docs/backlog/revisor/achados_panes_iframe_pdf.md).
-->
<div style="display: flex; justify-content: center; overflow: auto; background: var(--bg-tertiary); border-radius: 8px; padding: 1rem;">
    <canvas id="pub-viewer-canvas" style="box-shadow: 0 4px 16px rgba(0,0,0,0.3); max-width: 100%;"></canvas>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/publicacoes_viewer.js"></script>
{% endblock %}
