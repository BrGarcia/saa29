name: CI - SAA29

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # APP_SECRET_KEY e APP_ENV nao sao definidos aqui de proposito:
      # tests/conftest.py os atribui diretamente antes de importar a app e
      # e o dono unico deles durante a suite. Defini-los tambem aqui criava
      # config morta — o valor do workflow era sobrescrito e, ainda assim,
      # nao passava no validador de tamanho de APP_SECRET_KEY.
      # Aspas obrigatorias: o valor termina em ':' e sem elas o YAML o
      # interpreta como chave de mapeamento.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest-asyncio pytest-cov

    - name: Lint with Ruff
      run: ruff check .

    - name: Run Tests
      run: |
        pytest --cov=app --cov-report=term-missing
