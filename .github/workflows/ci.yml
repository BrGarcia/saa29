name: CI - SAA29

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Rede de segurança: a suíte roda em ~1min30s localmente. Sem este teto,
    # um processo que trave por qualquer motivo (thread não-daemon que não
    # fecha, subprocesso órfão) consome as 6h do limite padrão do Actions —
    # já aconteceu duas vezes nesta branch (runs 30937809568 e 30992210780,
    # ambos cancelados após exatamente 6h). Isso não corrige a causa, só
    # limita o desperdício enquanto ela é investigada (ver conftest.py).
    timeout-minutes: 15

    env:
      # APP_SECRET_KEY e APP_ENV nao sao definidos aqui de proposito:
      # tests/conftest.py os atribui diretamente antes de importar a app e
      # e o dono unico deles durante a suite. Defini-los tambem aqui criava
      # config morta — o valor do workflow era sobrescrito e, ainda assim,
      # nao passava no validador de tamanho de APP_SECRET_KEY.
      # Aspas obrigatorias: o valor termina em ':' e sem elas o YAML o
      # interpreta como chave de mapeamento.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: ruff check .

    - name: Run Tests
      run: |
        pytest --cov=app --cov-report=term-missing
