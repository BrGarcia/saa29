name: CI - SAA29

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db-type: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saa29_user
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: saa29_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # APP_SECRET_KEY e APP_ENV nao sao definidos aqui de proposito:
      # tests/conftest.py os atribui diretamente antes de importar a app e
      # e o dono unico deles durante a suite. Defini-los tambem aqui criava
      # config morta — o valor do workflow era sobrescrito e, ainda assim,
      # nao passava no validador de tamanho de APP_SECRET_KEY.
      DATABASE_URL: ${{ matrix.db-type == 'postgres' && 'postgresql+asyncpg://saa29_user:password123@localhost:5432/saa29_db_test' || 'sqlite+aiosqlite:///:memory:' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1 libpq-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy pytest-asyncio pytest-cov

    - name: Lint with Ruff
      run: ruff check .

    - name: Run Tests
      run: |
        pytest --cov=app --cov-report=term-missing
